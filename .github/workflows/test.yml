name: Test Repository CI

on:
  push:
  pull_request:
    branches:
      - development
  workflow_dispatch:
    inputs:
      include_backend_coverage:
        description: Download JaCoCo artifacts from a selected backend CI run
        required: true
        default: false
        type: boolean
      backend_workflow_run_id:
        description: Backend GitHub Actions run ID that produced the JaCoCo artifacts
        required: false
        type: string
      backend_commit_sha:
        description: Backend commit SHA represented by those artifacts
        required: false
        type: string
      backend_ci_run_id:
        description: Optional successful backend CI run ID to cite in the final PDFs
        required: false
        type: string
      backend_ci_sha:
        description: Backend commit SHA for backend_ci_run_id
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Static Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python for evidence generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF report generator
        run: python -m pip install --disable-pip-version-check -r tools/requirements-pdf.txt

      - name: Run verification
        env:
          TEST_ENV_ENABLED: 'false'
          TEST_E2E_ENABLED: 'false'
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate backend coverage inputs
        if: ${{ inputs.include_backend_coverage == true }}
        env:
          BACKEND_RUN_ID: ${{ inputs.backend_workflow_run_id }}
          BACKEND_COMMIT_SHA: ${{ inputs.backend_commit_sha }}
          BACKEND_ARTIFACTS_TOKEN: ${{ secrets.BACKEND_ARTIFACTS_TOKEN }}
        shell: bash
        run: |
          test -n "$BACKEND_RUN_ID" || { echo "backend_workflow_run_id is required"; exit 1; }
          test -n "$BACKEND_COMMIT_SHA" || { echo "backend_commit_sha is required"; exit 1; }
          test -n "$BACKEND_ARTIFACTS_TOKEN" || { echo "Configure BACKEND_ARTIFACTS_TOKEN with read access to backend workflow artifacts"; exit 1; }

      - name: Verify backend run identity and successful conclusion
        if: ${{ inputs.include_backend_coverage == true }}
        env:
          GH_TOKEN: ${{ secrets.BACKEND_ARTIFACTS_TOKEN }}
          BACKEND_RUN_ID: ${{ inputs.backend_workflow_run_id }}
          EXPECTED_BACKEND_SHA: ${{ inputs.backend_commit_sha }}
        shell: bash
        run: |
          if [[ ! "$BACKEND_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "backend_workflow_run_id must be numeric."
            exit 1
          fi
          if [[ ! "$EXPECTED_BACKEND_SHA" =~ ^[[:xdigit:]]{7,40}$ ]]; then
            echo "backend_commit_sha must be a 7-40 character Git SHA."
            exit 1
          fi
          run_json="$(gh api "repos/SENG-34213/Mentify-backend/actions/runs/${BACKEND_RUN_ID}")"
          actual_sha="$(jq -r '.head_sha' <<< "$run_json" | tr '[:upper:]' '[:lower:]')"
          expected_sha="$(printf '%s' "$EXPECTED_BACKEND_SHA" | tr '[:upper:]' '[:lower:]')"
          conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          if [[ "$actual_sha" != "$expected_sha" && "$actual_sha" != "$expected_sha"* ]]; then
            echo "Selected backend run SHA does not match backend_commit_sha."
            exit 1
          fi
          if [[ "$conclusion" != "success" ]]; then
            echo "Selected backend workflow run did not conclude successfully (conclusion: ${conclusion})."
            exit 1
          fi

      - name: Require unit JaCoCo artifacts
        id: backend_artifacts
        if: ${{ inputs.include_backend_coverage == true }}
        env:
          GH_TOKEN: ${{ secrets.BACKEND_ARTIFACTS_TOKEN }}
          BACKEND_RUN_ID: ${{ inputs.backend_workflow_run_id }}
        shell: bash
        run: |
          artifacts="$(gh api "repos/SENG-34213/Mentify-backend/actions/runs/${BACKEND_RUN_ID}/artifacts?per_page=100")"
          unit_count="$(jq '[.artifacts[] | select(.name | startswith("jacoco-unit-"))] | length' <<< "$artifacts")"
          integration_count="$(jq '[.artifacts[] | select(.name | startswith("jacoco-integration-"))] | length' <<< "$artifacts")"
          if (( unit_count == 0 )); then
            echo "Backend run has no jacoco-unit-* artifacts. Ensure the backend unit job executes JaCoCo report generation."
            exit 1
          fi
          echo "integration_count=${integration_count}" >> "$GITHUB_OUTPUT"
          echo "Found ${unit_count} unit and ${integration_count} optional integration JaCoCo artifact(s)."

      - name: Download backend unit coverage reports
        if: ${{ inputs.include_backend_coverage == true }}
        uses: actions/download-artifact@v4
        with:
          repository: SENG-34213/Mentify-backend
          run-id: ${{ inputs.backend_workflow_run_id }}
          github-token: ${{ secrets.BACKEND_ARTIFACTS_TOKEN }}
          pattern: jacoco-unit-*
          path: artifacts/backend-jacoco/unit

      - name: Download backend integration coverage reports
        if: ${{ inputs.include_backend_coverage == true && steps.backend_artifacts.outputs.integration_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          repository: SENG-34213/Mentify-backend
          run-id: ${{ inputs.backend_workflow_run_id }}
          github-token: ${{ secrets.BACKEND_ARTIFACTS_TOKEN }}
          pattern: jacoco-integration-*
          path: artifacts/backend-jacoco/integration

      - name: Require JaCoCo XML from the selected backend run
        if: ${{ inputs.include_backend_coverage == true }}
        shell: bash
        run: |
          if ! find artifacts/backend-jacoco -type f -name jacoco.xml -print -quit | grep -q .; then
            echo "The selected backend run supplied no JaCoCo XML reports; coverage evidence cannot be generated."
            exit 1
          fi

      - name: Verify optional backend CI provenance for final reports
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.backend_ci_run_id != '' || inputs.backend_ci_sha != '') }}
        env:
          BACKEND_CI_RUN_ID: ${{ inputs.backend_ci_run_id }}
          EXPECTED_BACKEND_CI_SHA: ${{ inputs.backend_ci_sha }}
        shell: bash
        run: |
          test -n "$BACKEND_CI_RUN_ID" || { echo "backend_ci_run_id and backend_ci_sha must be supplied together."; exit 1; }
          test -n "$EXPECTED_BACKEND_CI_SHA" || { echo "backend_ci_run_id and backend_ci_sha must be supplied together."; exit 1; }
          [[ "$BACKEND_CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "backend_ci_run_id must be numeric."; exit 1; }
          [[ "$EXPECTED_BACKEND_CI_SHA" =~ ^[[:xdigit:]]{40}$ ]] || { echo "backend_ci_sha must be a full 40-character SHA."; exit 1; }
          run_json="$(curl --fail --silent --show-error "https://api.github.com/repos/SENG-34213/Mentify-backend/actions/runs/${BACKEND_CI_RUN_ID}")"
          actual_sha="$(jq -r '.head_sha | ascii_downcase' <<< "$run_json")"
          expected_sha="$(printf '%s' "$EXPECTED_BACKEND_CI_SHA" | tr '[:upper:]' '[:lower:]')"
          conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          test "$actual_sha" = "$expected_sha" || { echo "Backend run SHA does not match backend_ci_sha."; exit 1; }
          test "$conclusion" = "success" || { echo "Backend CI run must have conclusion success."; exit 1; }
          echo "BACKEND_CI_CONCLUSION=${conclusion}" >> "$GITHUB_ENV"

      - name: Test test-evidence class-name resolution
        if: always()
        run: python -m unittest tools.test_test_evidence

      - name: Test final testing PDF generation
        if: always()
        run: python -B -m unittest tools.test_generate_testing_pdfs

      - name: Generate executed test register and coverage availability summary
        if: always()
        env:
          BACKEND_COMMIT_SHA: ${{ inputs.backend_commit_sha || 'unknown' }}
          BACKEND_RUN_ID: ${{ inputs.backend_workflow_run_id || 'not-supplied' }}
        run: >-
          python tools/test-evidence.py
          --junit-dir target/surefire-reports
          --junit-dir target/failsafe-reports
          --jacoco-dir artifacts/backend-jacoco
          --metadata docs/test-case-mappings.csv
          --output-dir target/test-evidence
          --fail-on-unmapped-tests

      - name: Check documentation and repository hygiene
        shell: bash
        run: |
          test -f docs/requirement-traceability.md
          test -f docs/test-case-index.md
          test -f docs/known-limitations.md
          test -f docs/test-execution.md
          test -f docs/security-testing.md
          test -f docs/resilience-testing.md
          test -f docs/negative-path-test-cases.md
          test -f docs/performance-testing.md
          test -f docs/performance-baseline.md
          test -f docs/api-contract-testing.md
          test -f docs/contract-baseline.md
          test -f docs/contract-change-process.md
          test -f docs/staging-release-smoke.md
          test -f docs/staging-test-cases.md
          test -f .github/workflows/staging-smoke.yml
          test ! -f .env

      - name: Generate final testing PDFs
        if: always()
        env:
          TEST_REPORT_SHA: ${{ github.sha }}
          TEST_REPORT_BRANCH: ${{ github.ref_name }}
          BACKEND_CI_RUN_ID: ${{ inputs.backend_ci_run_id }}
          BACKEND_CI_SHA: ${{ inputs.backend_ci_sha }}
        run: >-
          python tools/generate-testing-pdfs.py
          --register target/test-evidence/test-register.csv
          --evidence target/test-evidence/evidence.json
          --coverage-summary target/test-evidence/coverage-summary.md
          --output-dir target/testing-pdfs
          --test-sha "$TEST_REPORT_SHA"
          --branch "$TEST_REPORT_BRANCH"
          --backend-ci-run-id "$BACKEND_CI_RUN_ID"
          --backend-ci-sha "$BACKEND_CI_SHA"
          --backend-ci-conclusion "${BACKEND_CI_CONCLUSION:-}"

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ github.run_number }}
          path: target/failsafe-reports/
          if-no-files-found: warn

      - name: Upload test evidence register
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.run_number }}
          path: target/test-evidence/
          if-no-files-found: warn

      - name: Upload final testing PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-testing-pdfs-${{ github.run_number }}
          path: target/testing-pdfs/
          if-no-files-found: warn

      - name: Preserve downloaded backend coverage reports
        if: ${{ always() && inputs.include_backend_coverage == true }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-inputs-${{ github.run_number }}
          path: artifacts/backend-jacoco/
          if-no-files-found: warn
